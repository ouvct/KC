<meta charset="utf-8">
<title>Komune Landing Motion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://use.typekit.net/dul6sfw.css">
<style>
/* Layout: one fixed stage for the intro, then the real work page underneath. Single light look by choice. */
:root{
  --paper:#fbfbfa; --ink:#111110; --logo:#ababab; --mute:#9a9a96; --line:#cfcfcb; --scrim:rgba(10,10,9,.28);
  --sans:"forma-djr-micro","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.12,1);
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:500}
body{margin:0} /* browsers add an 8px margin by default; the preview hid this, Netlify didn't */
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- INTRO STAGE ---------- */
#stage{position:fixed;inset:0;z-index:20;background:var(--paper);overflow:hidden;transition:opacity 1.2s var(--ease)}
#stage.gone{opacity:0;pointer-events:none}
.clips{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease)}
.stage-video .clips{opacity:1}
.clip{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:0}
.clip.on{opacity:1}
/* 失焦: the last frame drifts out of focus as the white-out comes in */
.clip{transition:filter 1.8s var(--ease),transform 1.8s var(--ease)}
#stage.defocus .clip{filter:blur(16px);transform:scale(1.06)}
.clips::after{content:"";position:absolute;inset:0;background:var(--scrim)}
.c1{background:radial-gradient(60% 50% at 30% 40%,#c8b79a,transparent),linear-gradient(120deg,#5b4632,#2a211a 60%,#7a6650)}
.c2{background:radial-gradient(50% 40% at 60% 55%,#e9e2d5,transparent),linear-gradient(200deg,#3a3532,#151312 70%)}
.c3{background:radial-gradient(70% 60% at 50% 30%,#efe8dc,transparent),linear-gradient(160deg,#6b5238,#2b2016 65%,#8d7357)}
@keyframes drift{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,1%)}}


.logo{position:absolute;left:50%;top:50%;width:clamp(64px,6.72vw,140px);transform:translate(-50%,-50%);z-index:3;opacity:0;color:var(--ink);transition:opacity 1.4s var(--ease),color .9s var(--ease)}
.stage-video .logo{color:#fff}
.logo.draw{opacity:1}
.logo.draw.out{opacity:0;transition-duration:1s}

.statement{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:calc(100vw - 32px);z-index:3;color:#fff;font-size:clamp(13px,1.25vw,17px);font-weight:500;line-height:1.3;text-align:center;white-space:nowrap;margin:0}
@media (max-width:600px){.statement{white-space:normal;width:86vw;text-wrap:balance}}
.statement{opacity:0;transition:opacity 1.2s var(--ease)}
.statement.in{opacity:1}
.statement.in.out{opacity:0;transition-duration:.9s}

.whiteout{position:absolute;inset:0;background:var(--paper);opacity:0;z-index:5;transition:opacity 1.3s var(--ease)}
.whiteout.on{opacity:1}
#stage.exitable{cursor:pointer}

/* ---------- WORK PAGE ---------- */
/* Two-column project index: one large 3:2 cover per project, title and tags beneath */
/* fluid: no fixed page width. Side margins are 3.33% of the screen (48px on a 1440 screen, the Figma frame), and above 1440
   the margins, gaps, photos and logo grow in proportion. Text stays at fixed sizes, matching the Komune retail site */
main{margin:0;padding-inline:max(0px,calc(3.333vw - 16px));padding-block:0 max(180px,12.5vw)}
/* header stays pinned while the covers scroll up under it */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:24px;padding-block:max(24px,min(2.6vw,40px),2.78vw) max(20px,min(2.2vw,32px),2.22vw)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header svg{width:max(30px,min(2.6vw,44px),3.06vw);height:auto;color:var(--logo)}
nav{display:flex;gap:max(24px,min(5.5vw,80px),5.56vw);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
nav a{color:var(--mute);text-decoration:none;transition:color .3s}
nav a[aria-current],nav a:hover,nav a[aria-expanded=true]{color:var(--ink)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .8s var(--ease)}
.drawer.open{grid-template-rows:1fr}
.drawer>div{overflow:hidden;min-height:0}
.drawer-inner{display:grid;grid-template-columns:repeat(4,max-content);column-gap:max(40px,min(9vw,120px),8.33vw);row-gap:16px;padding-block:max(56px,3.9vw) 22px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.drawer-inner{grid-template-columns:repeat(2,max-content)}}
.drawer ul{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.6}
.drawer li{opacity:0;transform:translateY(-6px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.drawer.open li{opacity:1;transform:none;transition-delay:calc(.25s + var(--d,0s))}
.drawer li a{color:var(--ink);text-decoration:none;transition:color .3s}
.drawer-inner:hover li a{color:var(--mute)}
.drawer-inner li a:hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:max(24px,min(5vw,72px),5vw);row-gap:max(28px,min(2.8vw,40px),2.78vw);margin-top:max(72px,min(11.5vw,166px),11.53vw)}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr);margin-top:56px}}
.card{display:block;color:inherit;text-decoration:none;min-width:0}
.cover{aspect-ratio:3/2;max-width:100%;overflow:hidden;background:#e7e6e2}
.cover img,.cover i{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.card:hover .cover img,.card:hover .cover i{transform:scale(1.03)}
.card h2{margin:16px 0 0;font-size:13px;font-weight:500;letter-spacing:.01em;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{font-size:10px;line-height:1;color:var(--mute);border:1px solid var(--line);padding:.2em .4em}
.tags span.ind{background:var(--line);border-color:var(--line);color:var(--paper)}


.replay{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:500 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;padding:10px 14px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  #stage{display:none}
}

/* ---------- PLUS GAME (from Komune Plus Game) ---------- */
.logo-btn{background:none;border:0;padding:8px;margin:-8px;cursor:pointer;line-height:0;color:var(--logo);border-radius:2px}
.logo-btn svg{display:block;overflow:visible}
.logo-btn:focus-visible{outline:1px solid var(--mute);outline-offset:2px}
#plus{transform-box:fill-box;transform-origin:center;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.logo-btn:hover #plus{transform:rotate(16deg) translateY(1px)}
.logo-btn.empty #plus{opacity:0}
.logo-btn.pulse svg{animation:pulse .7s cubic-bezier(.22,1,.36,1)}
@keyframes pulse{40%{transform:scale(1.045)}100%{transform:scale(1)}}
#plusStage{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;touch-action:none}
#plusStage.live{pointer-events:auto;cursor:grab}
#plusStage.grabbing{cursor:grabbing}
.plusbar{position:fixed;left:0;right:0;top:120px;z-index:12;font-size:12px;color:var(--mute);opacity:0;transition:opacity .8s;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.plusbar.show{opacity:1}
.plusbar .inner{max-width:1344px;margin:0 auto;display:flex;justify-content:space-between;gap:16px}
.plusbar button{pointer-events:auto;background:none;border:0;padding:4px 0;font:inherit;color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.plusbar button:hover{color:var(--ink)}

/* ---------- PHONES ONLY (screens 640px wide or less) ---------- */
/* everything above is shared; these lines only take over on small screens, so desktop is untouched */
@media (max-width:640px){
  nav{font-size:13px;gap:16px}
  .card h2{font-size:15px;margin-top:12px}
  /* tags: always one row; sized to the screen, then nudged smaller by script if a long set still doesn't fit */
  .tags{flex-wrap:nowrap;gap:.4em;font-size:min(10px,2.4vw);overflow:hidden}
  .tags span{font-size:1em;padding:.25em .4em;white-space:nowrap;flex:none}
  /* the + canvas lets touches through to the page so it scrolls; a touch on a + is picked up by script */
  #plusStage.live{pointer-events:none}
  .drawer ul{font-size:14px}
  .statement{font-size:15px}
  .replay{font-size:12px}
}
</style>

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const stage=$("stage"),logo=$("logo"),stmt=$("statement"),white=$("whiteout");
const text="Komune Consulting is a creative strategy studio in New York City";
let timers=[],canExit=false,exiting=false,seqRun=0;
/* clips play back to back in order (7, 11, 6, 14, 9), each in full, as straight cuts; the last one ends the intro */
function startClips(clips,onDone){
  const run=++seqRun;let k=0;
  const show=i=>{const v=clips[i];v.currentTime=0;v.play().catch(()=>{});v.classList.add("on");};
  show(0);
  const tick=()=>{
    if(run!==seqRun)return;
    const v=clips[k];
    if(v.ended||(v.duration&&v.currentTime>=v.duration-0.03)){
      if(k===clips.length-1){onDone&&onDone();return;} // 9.mov plays to its end, then the intro leaves
      const prev=v;k++;show(k);prev.classList.remove("on");prev.pause();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function stopClips(){seqRun++;document.querySelectorAll(".clip").forEach(c=>c.pause());}
const at=(ms,fn)=>timers.push(setTimeout(fn,ms));


function finish(){
  timers.forEach(clearTimeout);stopClips();
  stage.classList.add("gone");
  document.documentElement.style.overflow="";
}

/* same exit whether it plays out or the visitor clicks: sentence fades, white-out, work page */
function exitIntro(){
  if(exiting)return;exiting=true;
  timers.forEach(clearTimeout);timers=[];
  stmt.classList.add("out");
  stage.classList.add("defocus");
  at(600,()=>white.classList.add("on"));
  at(2000,finish);
}
function play(){
  if(reduce){return}
  canExit=true;exiting=false; // the intro can be clicked away at any moment
  timers.forEach(clearTimeout);stopClips();
  document.documentElement.style.overflow="hidden";
  scrollTo(0,0);
  stage.className="exitable";white.className="whiteout";logo.setAttribute("class","logo");
  stmt.className="statement";
  stmt.textContent=text;
  const clips=[...document.querySelectorAll(".clip")];
  clips.forEach(c=>{c.classList.remove("on");c.pause();c.currentTime=0});

  // 1. logo draws itself on white
  at(300,()=>logo.classList.add("draw"));
  // 2. clips fade in behind, logo turns white
  at(1700,()=>{stage.classList.add("stage-video");startClips(clips,exitIntro);});
  // 3. logo fades, statement emerges word by word
  at(4100,()=>logo.classList.add("out"));
  at(4900,()=>stmt.classList.add("in"));
  // 4. statement out, white wipe, work page

}
/* CLIENTS: the list opens under the header and pushes the projects down */
const clientCols=[["Tea Brand","Design Studio","Clothing Brand","Accessories Brand"],["Tea Brand","Design Studio","Clothing Brand","Accessories Brand"],["Clothing Showroom","Space Ship","Water Brand","Tailor Shop"],["Clothing Showroom","Space Ship","Water Brand","Tailor Shop"]];
$("drawer-inner").innerHTML=clientCols.map((col,c)=>`<ul>${col.map((n,r)=>`<li style="--d:${(c*4+r)*0.03}s"><a href="#work">${n}</a></li>`).join("")}</ul>`).join("");
const drawer=$("drawer"),clientsLink=$("clients-link");
clientsLink.onclick=e=>{e.preventDefault();const open=!drawer.classList.contains("open");drawer.classList.toggle("open",open);clientsLink.setAttribute("aria-expanded",open);};
stage.addEventListener("click",()=>{if(canExit)exitIntro()});
addEventListener("keydown",e=>{if(canExit&&["Enter"," ","Escape"].includes(e.key))exitIntro()});
$("replay").onclick=play;
if(!reduce)play();
</script>
<script>
/* Komune plus game: click the logo, the + jumps off and it rains +'s.
   Drag one back into the logo, or click the logo again, and they all fly home.
   On phones, tilting the screen moves the gravity. */
(() => {
  const logoBtn = document.getElementById('logoBtn');
  const logoSvg = document.getElementById('logoSvg');
  // build the header logo from the shared mark, keeping the + as its own path (done first, so the logo shows even if the game can't load)
  const src = [...document.querySelectorAll('#k-mark path')];
  logoSvg.innerHTML = src.map((p, i) => `<path ${i === 2 ? 'id="plus" ' : ''}fill="currentColor" d="${p.getAttribute('d')}"/>`).join('');
  if (!window.Matter) return;
  const { Engine, Bodies, Body, Composite, Mouse, MouseConstraint, Events, Query, Constraint } = Matter;
  const isPhone = () => innerWidth <= 640;
  const heldBody = () => grab.body || touchBody;
  const OBST = 0x0004;   // collision category for the page's images and text
  const STICKY = 0x0008; // the nav, pinned in the header: always solid
  const PLUS = new Path2D(src[2].getAttribute('d'));
  const PC = { x: 19.95, y: 7.84 }, PW = 5.4;       // plus centre and width in logo units
  const INK = getComputedStyle(document.documentElement).getPropertyValue('--logo').trim() || '#ababab';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('plusStage');
  const ctx = canvas.getContext('2d');
  const header = document.querySelector('header');

  const G = 1.45;
  const FADE = 0.5; // +'s out on the page are drawn at half opacity; they firm up to full as they slot back into the logo
  const engine = Engine.create({ gravity: { x: 0, y: G } });
  engine.positionIterations = 10; engine.velocityIterations = 8;

  let W, H, walls = [], ceiling = null, platforms = [];
  // the top two covers on screen act as ledges the +'s can land on
  let platformEls = [];
  function buildPlatforms(els) {
    removePlatforms();
    platformEls = els;
    platforms = els.map(el => { const r = rectOf(el); return Bodies.rectangle(r.left + r.width / 2, r.top + r.height / 2, Math.max(1, r.width), Math.max(1, r.height), { isStatic: true, friction: 0.8, collisionFilter: { category: el.matches('nav a') ? STICKY : OBST, mask: 0xFFFFFFFF } }); });
    Composite.add(engine.world, platforms);
  }
  // every image and every piece of text in the project grid is solid: covers, project titles and tags (the nav is not; +'s fall straight past it)
  function rectOf(el) {
    if (el.matches('h2')) { const rg = document.createRange(); rg.selectNodeContents(el); return rg.getBoundingClientRect(); } // the words, not the full-width line
    return el.getBoundingClientRect();
  }
  function addPlatforms() {
    buildPlatforms([...document.querySelectorAll('.cover, .card h2, .tags span')]);
  }
  // +'s resting on the bottom of the screen pass through page content as it scrolls past them, so the pile stays put
  function ghostFloor() {
    const fl = floorSet();
    for (const p of pluses) {
      let ghost = p === heldBody(); // the + in your hand can be carried across images to the logo
      if (!ghost && fl.has(p)) for (const c of Query.collides(p, platforms.filter(b => b.collisionFilter.category === OBST))) if (c && c.depth > 2) { ghost = true; break; }
      p.collisionFilter.mask = ghost ? (0xFFFFFFFF & ~OBST) : 0xFFFFFFFF;
    }
  }
  // the ledges ride along with their covers when the page scrolls
  function syncPlatforms() {
    platforms.forEach((b, i) => { const r = rectOf(platformEls[i]); Body.setPosition(b, { x: r.left + r.width / 2, y: r.top + r.height / 2 }); });
  }
  function removePlatforms() { if (platforms.length) Composite.remove(engine.world, platforms); platforms = []; platformEls = []; }
  const T = 400;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (walls.length) Composite.remove(engine.world, walls);
    walls = [
      Bodies.rectangle(W / 2, H + T / 2, W * 3, T, { isStatic: true, friction: 0.9 }),
      Bodies.rectangle(-T / 2, 0, T, H * 6, { isStatic: true }),
      Bodies.rectangle(W + T / 2, 0, T, H * 6, { isStatic: true })
    ];
    Composite.add(engine.world, walls);
    if (ceiling) { Composite.remove(engine.world, ceiling); ceiling = null; addCeiling(); }
    if (platforms.length) buildPlatforms(platformEls.slice());
  }
  // a lid on the screen, added once the rain has landed, so tilting the phone can't tip +'s off the top
  function addCeiling() {
    ceiling = Bodies.rectangle(W / 2, -T / 2, W * 3, T, { isStatic: true, friction: 0.9 });
    Composite.add(engine.world, ceiling);
  }
  resize(); addEventListener('resize', resize);

  const mouse = Mouse.create(canvas);
  ['mousewheel', 'DOMMouseScroll', 'wheel'].forEach(e => canvas.removeEventListener(e, mouse.mousewheel));
  const grab = MouseConstraint.create(engine, {
    mouse, collisionFilter: { category: 0x0001, mask: 0x0002, group: 0 },
    constraint: { stiffness: 0.16, damping: 0.12, render: { visible: false } }
  });
  Composite.add(engine.world, grab);
  // fix: the canvas is drawn at screen density (2x on Retina), so tell Matter's mouse; without this, grabs land in the wrong place
  const syncDpr = () => { mouse.pixelRatio = Math.min(window.devicePixelRatio || 1, 2); };
  syncDpr(); addEventListener('resize', syncDpr);

  let state = 'idle', pluses = [], queue = [], flights = [], flightT0 = 0, hintTimer, homing = [];
  let lastT = 0, acc = 0; // physics runs on real time, so a dropped frame no longer slows the fall

  /* ---- scrolling while the +'s are out ----
     +'s piled on the bottom of the screen stay put; everything else belongs to the page and scrolls away with it */
  let lastScroll = 0, parked = [];
  function floorSet() {
    const adj = new Map(), link = (a, b) => { if (!adj.has(a)) adj.set(a, []); adj.get(a).push(b); };
    for (const pr of engine.pairs.list) { if (!pr.isActive) continue; const a = pr.bodyA.parent, b = pr.bodyB.parent; link(a, b); link(b, a); }
    // anything resting on the screen's bottom, or on the pinned nav, stays with the screen
    const roots = [walls[0]].concat(platforms.filter((b, i) => platformEls[i] && platformEls[i].matches('nav a')));
    const seen = new Set(roots), q = roots.slice();
    while (q.length) { const n = q.shift(); for (const m of adj.get(n) || []) if (!seen.has(m) && !m.isStatic) { seen.add(m); q.push(m); } }
    return seen;
  }
  function park(p) {
    pluses.splice(pluses.indexOf(p), 1);
    Composite.remove(engine.world, p);
    parked.push({ x: p.position.x, pageY: p.position.y + scrollY, a: p.angle, size: p.plusSize });
  }
  function followScroll(now) {
    const dy = scrollY - lastScroll; lastScroll = scrollY;
    syncPlatforms();
    if (!dy) return;
    const stay = floorSet(), held = heldBody(), hb = header.getBoundingClientRect().bottom;
    for (const p of pluses.slice()) {
      if (stay.has(p) || p === held || now - p.born < 2500) continue; // floor pile, the one in hand, and fresh rain stay with the screen
      Body.setPosition(p, { x: p.position.x, y: p.position.y - dy });
      if (p.position.y < hb - p.plusSize / 2 || p.position.y > H - p.plusSize / 2) park(p); // slips under the pinned header, like the images do
    }
  }
  function unpark() {
    parked = parked.filter(q => {
      const y = q.pageY - scrollY, hb = header.getBoundingClientRect().bottom;
      if (y > hb && y < H - 40) { const b = makePlus(q.x, y, q.size); Body.setAngle(b, q.a); b.born = 0; return false; }
      return true;
    });
  }

  // dragging one + into the logo sends only that one home; the rest stay where they are
  function returnOne(b) {
    const i = pluses.indexOf(b); if (i < 0) return;
    pluses.splice(i, 1);
    Composite.remove(engine.world, b);
    grab.body = null; grab.constraint.bodyB = null; canvas.classList.remove('grabbing');
    if (touchBody === b) dropTouch();
    homing.push({ x0: b.position.x, y0: b.position.y, a0: b.angle, s0: b.plusSize, t0: performance.now(), dur: reduce ? 300 : 650 });
  }
  function settleLogo() {
    logoBtn.classList.remove('empty', 'pulse'); void logoBtn.offsetWidth;
    logoBtn.classList.add('pulse'); setTimeout(() => logoBtn.classList.remove('pulse'), 750);
  }
  function drawHoming(now, s) {
    homing = homing.filter(f => {
      const t = clamp((now - f.t0) / f.dur);
      if (t >= 1) { settleLogo(); return false; }
      const ex = ease(t), ey = ease(clamp(t * 1.3));
      const aTarget = Math.round(f.a0 / (Math.PI * 2)) * Math.PI * 2;
      drawPlus(f.x0 + (s.x - f.x0) * ex, f.y0 + (s.y - f.y0) * ey, f.a0 + (aTarget - f.a0) * ex, f.s0 + (s.s - f.s0) * ex, FADE + (1 - FADE) * ex);
      return true;
    });
  }
  const rand = (a, b) => a + Math.random() * (b - a);
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const clamp = t => Math.max(0, Math.min(1, t));

  function slot() {
    const r = logoSvg.getBoundingClientRect();
    return { x: r.left + PC.x / 70 * r.width, y: r.top + PC.y / 31 * r.height, s: PW / 70 * r.width };
  }

  function makePlus(x, y, size) {
    const th = size * 0.36, len = size * 0.96;
    const body = Body.create({
      parts: [Bodies.rectangle(x, y, len, th), Bodies.rectangle(x, y, th, len)],
      friction: 0.55, frictionAir: 0.006, restitution: 0.1, density: 0.002,
      collisionFilter: { category: 0x0002, mask: 0xFFFFFFFF, group: 0 }
    });
    body.plusSize = size; body.born = performance.now();
    Composite.add(engine.world, body); pluses.push(body);
    return body;
  }

  /* ---- tilt: phone orientation steers gravity ---- */
  let tiltOn = false;
  function onTilt(e) {
    if (e.beta == null || e.gamma == null) return;
    tiltOn = true;
    const rad = Math.PI / 180;
    let gx = Math.sin(e.gamma * rad), gy = Math.sin(e.beta * rad);
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    if (ang === 90) [gx, gy] = [gy, -gx];
    else if (ang === -90 || ang === 270) [gx, gy] = [-gy, gx];
    engine.gravity.x = gx * G * 1.2;
    engine.gravity.y = gy * G * 1.2;
  }
  function listenTilt() {
    if (!('DeviceOrientationEvent' in window) || !matchMedia('(pointer: coarse)').matches) return;
    const go = () => addEventListener('deviceorientation', onTilt);
    // iPhone asks permission; it has to be requested inside the tap itself
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') go(); }).catch(() => {});
    } else go();
  }
  let tiltAsked = false;

  function start() {
    if (state !== 'idle') return;
    if (!tiltAsked) { tiltAsked = true; listenTilt(); }
    state = 'falling';
    lastT = 0; acc = 0;
    if (!tiltOn) { engine.gravity.x = 0; engine.gravity.y = G; }
    lastScroll = scrollY; parked = [];
    logoBtn.classList.add('empty');
    canvas.classList.add('live');
    addPlatforms();
    const s = slot(), now = performance.now();
    const first = makePlus(s.x, s.y, isPhone() ? 18 : 30);
    first.fromLogo = s.s;
    Body.setVelocity(first, { x: 1.6, y: -3 });
    Body.setAngularVelocity(first, 0.06);
    const n = Math.round(Math.min(60, Math.max(16, W * H / 26000)));
    for (let i = 0; i < n; i++) queue.push({ at: now + 350 + i * (1300 / n) + rand(0, 120) });
    queue.sort((a, b) => a.at - b.at);
  }

  function goHome(chosen) {
    if (state !== 'falling') return;
    state = 'returning';
    queue = [];
    canvas.classList.remove('live', 'grabbing');
    grab.body = null; grab.constraint.bodyB = null; dropTouch();
    // +'s scrolled off the page fly home too, in from wherever they are
    const all = pluses.concat(parked.map(q => ({ position: { x: q.x, y: q.pageY - scrollY }, angle: q.a, plusSize: q.size })));
    parked = [];
    if (!all.length) { flights = []; flightT0 = performance.now(); return; }
    const s = slot();
    const d = p => Math.hypot(p.position.x - s.x, p.position.y - s.y);
    if (!chosen) chosen = all.slice().sort((a, b) => d(a) - d(b))[0];
    const others = all.filter(p => p !== chosen).sort((a, b) => d(a) - d(b));
    const stagger = Math.min(30, 1200 / Math.max(1, others.length));
    const fly = (p, delay, dur, home) => ({ x0: p.position.x, y0: p.position.y, a0: p.angle, s0: p.plusSize, delay, dur, home });
    flights = [fly(chosen, 0, reduce ? 300 : 650, true)]
      .concat(others.map((p, i) => fly(p, (reduce ? 0 : 300) + i * (reduce ? 0 : stagger), reduce ? 300 : 1150, false)));
    pluses.forEach(p => Composite.remove(engine.world, p));
    pluses = [];
    if (ceiling) { Composite.remove(engine.world, ceiling); ceiling = null; }
    flightT0 = performance.now();
  }

  function done() {
    state = 'idle'; flights = []; homing = []; queue = []; parked = [];
    ctx.clearRect(0, 0, W, H);
    document.documentElement.style.overflow = '';
    canvas.classList.remove('live', 'grabbing');
    dropTouch();
    removePlatforms();
    if (ceiling) { Composite.remove(engine.world, ceiling); ceiling = null; }
  }

  function drawPlus(x, y, a, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y); ctx.rotate(a);
    const k = size / PW; ctx.scale(k, k);
    ctx.translate(-PC.x, -PC.y);
    ctx.fillStyle = INK; ctx.fill(PLUS);
    ctx.restore();
  }

  Events.on(grab, 'startdrag', () => canvas.classList.add('grabbing'));
  Events.on(grab, 'enddrag', e => {
    canvas.classList.remove('grabbing');
    const s = slot(), b = e.body;
    if (b && Math.hypot(b.position.x - s.x, b.position.y - s.y) < 70) returnOne(b);
  });

  // clicking the logo again (it sits under the canvas while +'s are out) calls them all home
  let down = null;
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });

  /* phones: the page scrolls under your finger as usual; only a touch that lands on a + picks it up */
  let touchC = null, touchBody = null;
  function dropTouch() { if (touchC) Composite.remove(engine.world, touchC); touchC = null; touchBody = null; }
  addEventListener('touchstart', e => {
    if (state !== 'falling' || e.touches.length !== 1 || !matchMedia('(max-width:640px)').matches) return;
    const t = e.touches[0];
    let best = null, bd = 1e9;
    for (const p of pluses) { const d = Math.hypot(p.position.x - t.clientX, p.position.y - t.clientY); if (d < p.plusSize * 0.7 + 14 && d < bd) { bd = d; best = p; } }
    if (!best) return;                 // not on a +: let the page scroll
    e.preventDefault();
    dropTouch();
    touchBody = best;
    touchC = Constraint.create({ pointA: { x: t.clientX, y: t.clientY }, bodyB: best, pointB: { x: 0, y: 0 }, stiffness: 0.16, damping: 0.12, length: 0 });
    Composite.add(engine.world, touchC);
  }, { passive: false });
  addEventListener('touchmove', e => {
    if (!touchC) return;
    e.preventDefault();
    const t = e.touches[0]; touchC.pointA = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  const endTouch = () => {
    if (!touchC) return;
    const b = touchBody, s = slot(); dropTouch();
    if (b && Math.hypot(b.position.x - s.x, b.position.y - s.y) < 50) returnOne(b);
  };
  addEventListener('touchend', endTouch); addEventListener('touchcancel', endTouch);

  /* phones: shrink a project's tags a little more if they still don't fit on one line */
  function fitTags() {
    document.querySelectorAll('.tags').forEach(el => {
      el.style.fontSize = '';
      if (!isPhone()) return;
      let fs = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 1 && fs > 7) { fs -= 0.25; el.style.fontSize = fs + 'px'; }
    });
  }
  fitTags(); addEventListener('resize', fitTags);
  if (document.fonts) document.fonts.ready.then(fitTags);

  // cursor nudge: +'s near the cursor get pushed aside and carried along by its movement
  const cur = { x: -1e4, y: -1e4, vx: 0, vy: 0, on: false };
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    if (cur.on) { cur.vx = e.clientX - cur.x; cur.vy = e.clientY - cur.y; }
    cur.x = e.clientX; cur.y = e.clientY; cur.on = true;
  });
  canvas.addEventListener('pointerleave', () => { cur.on = false; });
  function nudge() {
    if (!cur.on || heldBody()) return;
    const R = 36, vx = Math.max(-30, Math.min(30, cur.vx)), vy = Math.max(-30, Math.min(30, cur.vy));
    // gentle: the push scales with how fast the cursor moves, so a still or slow cursor can rest on a + and pick it up
    const speed = Math.min(1, Math.hypot(vx, vy) / 18);
    if (speed < 0.05) return;
    for (const p of pluses) {
      const dx = p.position.x - cur.x, dy = p.position.y - cur.y, d = Math.hypot(dx, dy), r = R + p.plusSize / 2;
      if (d > r || d < 0.001) continue;
      const k = (1 - d / r) * speed, m = p.mass;
      Body.applyForce(p, { x: cur.x, y: cur.y }, {
        x: m * (0.0009 * k * dx / d + 0.00012 * k * vx),
        y: m * (0.0009 * k * dy / d + 0.00012 * k * vy)
      });
    }
    cur.vx *= 0.6; cur.vy *= 0.6;
  }
  canvas.addEventListener('pointerup', e => {
    if (state !== 'falling' || !down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved > 6) return;
    const r = logoSvg.getBoundingClientRect(), pad = 10;
    if (e.clientX >= r.left - pad && e.clientX <= r.right + pad && e.clientY >= r.top - pad && e.clientY <= r.bottom + pad) goHome(null);
  });

  function tick(now) {
    if (state !== 'idle') {
      ctx.clearRect(0, 0, W, H);
      const s = slot();

      if (state === 'falling') {
        while (queue.length && queue[0].at <= now) {
          queue.shift();
          let p;
          if (!isPhone()) p = makePlus(rand(24, W - 24), -rand(40, 260), rand(20, 46));
          // phones: smaller +'s, and about a third drop down the side margins so some reach the bottom
          else if (Math.random() < 0.35) p = makePlus(Math.random() < 0.5 ? rand(5, 10) : W - rand(5, 10), -rand(40, 260), rand(7, 11));
          else p = makePlus(rand(10, W - 10), -rand(40, 260), rand(9, 20));
          Body.setAngle(p, rand(-0.8, 0.8));
          Body.setAngularVelocity(p, rand(-0.04, 0.04));
        }
        if (tiltOn && !ceiling && !queue.length && pluses.every(p => p.position.y > 30)) addCeiling();
        followScroll(now);
        ghostFloor();
        unpark();
        nudge();
        const STEP = 1000 / 60;
        acc += lastT ? Math.min(100, now - lastT) : STEP; lastT = now;
        let steps = 0;
        while (acc >= STEP && steps < 5) { Engine.update(engine, STEP); acc -= STEP; steps++; }
        if (steps === 5) acc = 0;

        // the empty spot in the logo, breathing faintly
        if (logoBtn.classList.contains('empty')) drawPlus(s.x, s.y, 0, s.s, 0.22 + 0.12 * Math.sin(now / 380));

        const held = heldBody();
        if (held && Math.hypot(held.position.x - s.x, held.position.y - s.y) < Math.max(26, held.plusSize * 0.75)) returnOne(held);
        for (const p of pluses) {
          let size = p.plusSize;
          if (p.fromLogo) size = p.fromLogo + (p.plusSize - p.fromLogo) * ease(clamp((now - p.born) / 700));
          drawPlus(p.position.x, p.position.y, p.angle, size, FADE);
        }
        drawHoming(now, s);
        // every + dragged home by hand: the game ends on its own
        if (!pluses.length && !homing.length && !queue.length && !parked.length) done();
      }

      if (state === 'returning') {
        let finished = true;
        for (const f of flights) {
          const t = clamp((now - flightT0 - f.delay) / f.dur);
          if (t < 1) finished = false;
          if (f.home && t >= 1 && logoBtn.classList.contains('empty')) {
            logoBtn.classList.remove('empty');
            logoBtn.classList.add('pulse');
            setTimeout(() => logoBtn.classList.remove('pulse'), 750);
          }
          if (t >= 1) continue;
          const ex = ease(t), ey = ease(clamp(t * 1.3));
          const x = f.x0 + (s.x - f.x0) * ex;
          const y = f.y0 + (s.y - f.y0) * ey;
          const aTarget = Math.round(f.a0 / (Math.PI * 2)) * Math.PI * 2;
          const a = f.a0 + (aTarget - f.a0) * ex;
          const size = f.s0 + (s.s - f.s0) * ex;
          const alpha = f.home ? FADE + (1 - FADE) * ex : FADE * (t < 0.65 ? 1 : 1 - (t - 0.65) / 0.35);
          drawPlus(x, y, a, size, alpha);
        }
        drawHoming(now, s);
        if (finished && !homing.length) done();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  logoBtn.addEventListener('click', () => state === 'falling' ? goHome(null) : start());
  addEventListener('keydown', e => { if (e.key === 'Escape') goHome(null); });
})();
</script>
